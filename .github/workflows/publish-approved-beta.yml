name: Publish approved 0.5.0b2 beta (one time)

# Owner authorized one public experimental pre-release on 2026-10-30.
# This workflow is intentionally pinned to 0.5.0b2 and the reviewed source tree.
# It does not publish future versions; do not generalize this workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-kvr-beta-0-5-0b2
  cancel-in-progress: false

jobs:
  approved-beta:
    name: Validate and publish owner-approved 0.5.0b2
    if: github.repository == 'kinetic-it/kinetic-voice-router'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pin reviewed integration bytes, version and release scope
        shell: bash
        run: |
          set -euo pipefail
          REVIEWED_SHA=fbd12495d8e3612595b9df4ae7685eba9afc0892
          git cat-file -e "${REVIEWED_SHA}^{commit}"
          git diff --quiet "$REVIEWED_SHA" HEAD -- custom_components/kinetic_voice_router
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("custom_components/kinetic_voice_router/manifest.json").read_text())
          assert m["version"] == "0.5.0b2", m["version"]
          assert m["domain"] == "kinetic_voice_router"
          assert Path("hacs.json").is_file()
          PY
      - name: Install pinned test dependencies
        run: python -m pip install --quiet --require-hashes --only-binary ":all:" -r requirements-test.txt
      - name: Repeat full router, integration, lint and public-source audit
        shell: bash
        run: |
          set -euo pipefail
          python -I -m unittest discover -s tests/router
          python -m pytest -q tests/ha
          ruff check .
          ruff format --check .
          python scripts/audit_public.py
      - name: Prepare experimental beta release archive
        shell: bash
        run: |
          cd custom_components/kinetic_voice_router
          zip -q -r -X "$GITHUB_WORKSPACE/kinetic_voice_router.zip" . -x '*/__pycache__/*' -x '__pycache__/*'
      - name: Publish exactly one owner-approved GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5.0b2 >/dev/null 2>&1; then
            echo "BETA_RELEASE=ALREADY_PUBLISHED"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'NOTES'
          **Experimental beta – not production-ready. No warranty.**

          Kinetic Voice Router 0.5.0b2 fixes the Home Assistant conversation-agent language
          selector: Hermes Companion's wildcard language list ["*"] maps to Home Assistant's
          required literal wildcard "*". Without this fix, the agent was greyed out for a
          German Speaker pipeline even though the Hermes Companion connection worked.

          This beta is a standalone conversation integration with three modes: Off, Observe,
          Active. It does not execute device actions, expose entities, or change Assist pipelines.

          **Upgrade:** Use HACS, make an HA backup, and retain the working 0.4.3 backup and
          VM snapshot. Keep the old Speaker conversation agent selected until this version
          appears as selectable and a harmless live query succeeds. Keep Home Assistant's
          local intent preference enabled. Read [docs/MIGRATION.md](https://github.com/kinetic-it/kinetic-voice-router/blob/main/docs/MIGRATION.md).

          **Checks:** 142 router tests, 169 integration tests with fake Companion, HACS,
          hassfest, lint, public audit, independent Werkstatt run. HAOS with 0.5.0b1 already
          confirmed Companion reachability, **but the new 0.5.0b2 agent has not yet passed
          real conversation/inference testing**. Experimental; not for safety-critical or
          unattended use. MIT (personal/commercial use permitted, no warranty).
          NOTES
          gh release create "v0.5.0b2" kinetic_voice_router.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kinetic Voice Router v0.5.0b2 (experimental beta)" \
            --notes-file /tmp/release-notes.md
          gh release view v0.5.0b2 --json isDraft,isPrerelease,url,tagName
          echo "BETA_RELEASE=PASS"
