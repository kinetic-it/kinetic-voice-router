name: Release (attach tested archive)

# GitHub draft is created by the maintainer. Publishing it creates the version tag
# and triggers this workflow, which validates the tagged source and attaches the ZIP.
# The workflow never creates a second release and never deploys to Home Assistant.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Only experimental pre-releases
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: test "$IS_PRERELEASE" = "true"
      - name: Tag must equal the manifest version
        run: |
          version=$(python -c "import json;print(json.load(open('custom_components/kinetic_voice_router/manifest.json'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest v${version}" >&2; exit 1; }
      - name: Install pinned test dependencies
        run: python -m pip install --quiet --require-hashes --only-binary ":all:" -r requirements-test.txt
      - name: Full test suite and audit
        run: |
          python -I -m unittest discover -s tests/router
          python -m pytest -q tests/ha
          python scripts/audit_public.py
      - name: Build archive
        run: |
          cd custom_components/kinetic_voice_router
          zip -r -X "${GITHUB_WORKSPACE}/kinetic_voice_router.zip" . -x '*/__pycache__/*' -x '__pycache__/*'
      - name: Attach ZIP to published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" kinetic_voice_router.zip --clobber
