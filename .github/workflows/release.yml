name: Release (draft only)

# A pushed tag `vX.Y.Z[bN]` builds the integration archive and creates a DRAFT, pre-release
# GitHub release. Nothing becomes installable for users until a maintainer reviews the draft
# and presses "Publish release" by hand. No tag exists yet.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # create the draft release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must equal the manifest version
        run: |
          version=$(python -c "import json;print(json.load(open('custom_components/kinetic_voice_router/manifest.json'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest v${version}" >&2; exit 1; }
      - name: Install pinned test dependencies
        run: python -m pip install --quiet --require-hashes --only-binary ":all:" -r requirements-test.txt
      - name: Full test suite and audit
        run: |
          python -I -m unittest discover -s tests/router
          python -m pytest -q tests/ha
          python scripts/audit_public.py
      - name: Build archive
        run: |
          cd custom_components/kinetic_voice_router
          zip -r -X "${GITHUB_WORKSPACE}/kinetic_voice_router.zip" . -x '*/__pycache__/*' -x '__pycache__/*'
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" kinetic_voice_router.zip \
            --draft --prerelease --verify-tag \
            --title "Kinetic Voice Router ${GITHUB_REF_NAME} (experimental, no warranty)" \
            --notes "Experimental pre-release. No warranty. See CHANGELOG.md and docs/MIGRATION.md."
