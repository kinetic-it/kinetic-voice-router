name: CI

# Tests, lint and public-tree audit. Read-only access to the repository, no secrets,
# no Home Assistant instance, no hardware, no network access beyond the runner's own
# loopback (the tests start a local fake Hermes Companion).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router:
    name: router core + static guards (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Router tests (standard library only)
        run: python -I -m unittest discover -s tests/router -v

  integration:
    name: integration + lint (3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned test dependencies
        run: python -m pip install --quiet --require-hashes --only-binary ":all:" -r requirements-test.txt
      - name: Integration tests (Home Assistant contract stubs, local fake companion)
        run: python -m pytest -q tests/ha
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Public-tree audit (secrets, personal data, internal references, licence files)
        run: python scripts/audit_public.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
          # No brand icon is shipped until its origin and licence are confirmed.
          ignore: brands
